<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cascadia</title>
    <script src="https://cjrtnc.leaningtech.com/4.3/loader.js"></script>
    <style>
        html, body { margin: 0; height: 100%; background: #1b1f1b; color: #ddd; font-family: system-ui, sans-serif; }
        #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem; white-space: pre-wrap; }
        #status.hidden { display: none; }
        #status.error { color: #ff8a80; }
    </style>
</head>
<body>
<div id="status">Loading Cascadia…</div>
<script>
    const status = document.getElementById("status");
    (async function () {
        try {
            // The jar has no Main-Class in its manifest, so cheerpjRunJar can't be used;
            // launch the entry point (App.main) from the jar on the classpath instead.
            await cheerpjInit({ version: 17 });
            cheerpjCreateDisplay(1920, 1080);
            status.classList.add("hidden");
            await cheerpjRunMain("App", "/app/Cascadia-main.jar");
        } catch (e) {
            status.classList.remove("hidden");
            status.classList.add("error");
            status.textContent = "Failed to start: " + e;
            console.error(e);
        }
    })();
</script>
</body>
</html>
