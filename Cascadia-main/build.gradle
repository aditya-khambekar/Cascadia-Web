plugins {
    id 'java'
    id 'com.diffplug.spotless' version '8.9.0'
    id 'application'
}

application {
    mainClass = 'App'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

spotless {
    java {
        target fileTree(".") {
            include "**/*.java"
            exclude "**/build/**", "**/build-*/**"
        }
        importOrder()
        removeUnusedImports()
        palantirJavaFormat()
        princeOfSpace("2.2.0")
                .closingParenOnNewLine(true)
                .indentSize(4)
                .lineLength(100)
        leadingTabsToSpaces(4)
        toggleOffOn()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

project.compileJava.dependsOn(spotlessApply)
build.dependsOn(run)

repositories {
    mavenCentral()
}